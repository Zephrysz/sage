[project]
name = "cefis-ai-tutor-backend"
version = "0.1.0"
description = "CEFIS AI Tutor — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "pydantic-settings>=2.6.1",
    "httpx>=0.26",
    "supabase>=2.11.0",
    "python-dotenv>=1.0.1",
    "google-genai>=2.6.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.131.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
