services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    env_file: ./backend/.env
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file: ./frontend/.env
    command: npm run dev
    depends_on:
      - backend

  indexer:
    build: ./backend/indexer
    env_file: ./backend/.env
    restart: "no"
    volumes:
      - ./data:/data
