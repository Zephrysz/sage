services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file: .env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file: .env
    command: npm run dev
    depends_on:
      - backend

  indexer:
    build: ./backend/indexer
    env_file: .env
    restart: "no"
    volumes:
      - ./data:/data
