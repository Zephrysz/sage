services:
  backend:
    build:
      context: ./backend
      target: production
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      SESSION_STORE_PATH: /data/sessions.json
    volumes:
      - sessions_data:/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        # NEXT_PUBLIC_API_URL is baked into the JS bundle at build time.
        # Must be set explicitly here — env_file is not read during build.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set in the root .env file}
    ports:
      - "3000:3000"
    env_file: ./frontend/.env
    restart: unless-stopped
  indexer:
    build: ./backend/indexer
    env_file: ./backend/.env
    restart: "no"
    volumes:
      - ./data:/data

volumes:
  sessions_data:
