services:
  backend:
    build:
      context: ./backend
      target: production
    ports:
      - "8000:8000"
    env_file: .env
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2

  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - backend

  indexer:
    build: ./backend/indexer
    env_file: .env
    restart: "no"
    volumes:
      - ./data:/data
