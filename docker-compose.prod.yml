services:
  backend:
    build:
      context: ./backend
      target: production
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      SESSION_STORE_PATH: /data/sessions.json
    volumes:
      - sessions_data:/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        # NEXT_PUBLIC_API_URL is baked into the JS bundle at build time.
        # Set it in frontend/.env to your public backend URL.
        # e.g. https://api.yourdomain.com or http://your-server-ip:8000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    env_file: ./frontend/.env
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  indexer:
    build: ./backend/indexer
    env_file: ./backend/.env
    restart: "no"
    volumes:
      - ./data:/data

volumes:
  sessions_data:
